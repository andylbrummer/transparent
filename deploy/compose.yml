# transparent.sbdev.io on beagle-ab. No host port is published: the only way
# in is the Cloudflare tunnel sidecar, over the compose network.
name: transparent
services:
  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    cpus: 0.5
    mem_limit: 64m
    pids_limit: 64
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]

  cloudflared:
    image: cloudflare/cloudflared:latest
    # The image runs as uid 65532 and cannot read a 0600 credential owned by
    # beagle; run it as the owner rather than loosening the file mode.
    user: "1000:1000"
    restart: unless-stopped
    depends_on: [web]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      - /home/beagle/.config/cloudflared/transparent.json:/etc/cloudflared/creds.json:ro
    cpus: 0.25
    mem_limit: 128m

# Static server for the built app (app/dist), reachable only through the
# cloudflared sidecar on the compose network. Read-only GET/HEAD, no uploads.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Vite fingerprints everything under assets/, so it never changes in place.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Baked pipeline data keeps a fixed name across deploys; revalidate.
    location /geo/ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
}

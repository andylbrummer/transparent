<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Transparent Earth</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #canvas-container {
        width: 100%;
        height: 100%;
      }
      #canvas-container canvas {
        display: block;
        /* Orbit drags are ours: without this, mobile browsers claim the
           gesture for panning and cancel the pointer stream mid-drag. */
        touch-action: none;
      }
      #hud {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 14px;
        /* Sits above the canvas but must never swallow orbit drags. */
        pointer-events: none;
        font: 13px/1.4 system-ui, -apple-system, sans-serif;
        color: #cfd4e8;
        background: linear-gradient(to top, rgba(5, 5, 16, 0.85), transparent);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

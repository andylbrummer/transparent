<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Transparent Earth</title>
    <!-- No icon file: an empty one stops the browser asking for /favicon.ico and logging a 404. -->
    <link rel="icon" href="data:," />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #canvas-container {
        width: 100%;
        height: 100%;
      }
      #canvas-container canvas {
        display: block;
        /* Orbit drags are ours: without this, mobile browsers claim the
           gesture for panning and cancel the pointer stream mid-drag. */
        touch-action: none;
      }
      .place-labels {
        position: fixed;
        inset: 0;
        overflow: hidden;
        /* Names sit over the canvas but must never swallow drags. */
        pointer-events: none;
        font-family: system-ui, -apple-system, sans-serif;
        text-shadow: 0 0 3px #000, 0 1px 2px #000;
        white-space: nowrap;
      }
      /* Cardboard: each eye's labels clipped to its half of the screen. */
      .place-labels--left-eye {
        right: 50%;
      }
      .place-labels--right-eye {
        left: 50%;
      }
      .place-label {
        position: absolute;
        left: 0;
        top: 0;
        will-change: transform;
      }
      .place-label--country {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #ffe2a0;
      }
      .place-label--state {
        font-size: 11px;
        color: #d4ddff;
      }
      .place-label--city {
        font-size: 11px;
        color: #ffffff;
      }
      /* Geology, coloured to match its lines where it has them. */
      .place-label--plate {
        font-size: 12px;
        font-style: italic;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #d9c2ff;
      }
      .place-label--deep {
        font-size: 11px;
        font-weight: 600;
        color: #ffb38a;
      }
      .place-label--hotspot {
        font-size: 11px;
        color: #ffd166;
      }
      .place-label--subduction {
        font-size: 10px;
        font-style: italic;
        color: #ff8a8a;
      }
      .place-label--quake {
        font-size: 10px;
        font-weight: 600;
        color: #ffffff;
      }
      .place-label--volcano {
        font-size: 10px;
        color: #ff7b54;
      }
      .compass-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: calc(env(safe-area-inset-top) + 46px);
        overflow: hidden;
        /* Over the scene and the labels, but drags pass through to the view. */
        z-index: 1;
        pointer-events: none;
        font-family: system-ui, -apple-system, sans-serif;
        color: #e8ecff;
        background: linear-gradient(to bottom, rgba(5, 5, 16, 0.85), rgba(5, 5, 16, 0.55));
        border-bottom: 1px solid rgba(160, 180, 255, 0.25);
        text-shadow: 0 1px 2px #000;
      }
      .compass-bar__tape {
        position: absolute;
        left: 0;
        right: 0;
        top: env(safe-area-inset-top);
        height: 28px;
      }
      /* Each tick is a zero-width anchor at its bearing; the line and the
         centred label hang off it. */
      .compass-tick {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
        will-change: transform;
      }
      .compass-tick::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: 0;
        height: 6px;
        border-left: 1px solid rgba(220, 228, 255, 0.5);
      }
      .compass-tick--major::after,
      .compass-tick--cardinal::after {
        height: 10px;
        border-left-color: rgba(232, 236, 255, 0.85);
      }
      .compass-tick--north::after {
        border-left: 2px solid #ff7a6b;
      }
      .compass-tick span {
        position: absolute;
        left: 0;
        bottom: 13px;
        transform: translateX(-50%);
        color: rgba(232, 236, 255, 0.8);
      }
      .compass-tick--cardinal span {
        font-weight: 700;
        font-size: 13px;
        color: #fff;
      }
      .compass-tick--north span {
        color: #ff7a6b;
      }
      /* The slice of the compressed tape the camera actually sees. */
      .compass-bar__fov {
        position: absolute;
        left: 0;
        top: env(safe-area-inset-top);
        height: 28px;
        box-sizing: border-box;
        background: rgba(159, 220, 255, 0.12);
        border-left: 1px solid rgba(159, 220, 255, 0.55);
        border-right: 1px solid rgba(159, 220, 255, 0.55);
      }
      .compass-bar__caret {
        position: absolute;
        left: 50%;
        top: calc(env(safe-area-inset-top) + 28px);
        width: 0;
        height: 0;
        margin-left: -5px;
        border-left: 5px solid transparent;
        border-right: 5px solid transparent;
        border-bottom: 6px solid #9fdcff;
      }
      .compass-bar__readout {
        position: absolute;
        left: 50%;
        top: calc(env(safe-area-inset-top) + 33px);
        transform: translateX(-50%);
        font: 600 11px/1 system-ui, -apple-system, sans-serif;
        color: #9fdcff;
      }
      #reset-offset,
      #layers-toggle,
      #cardboard-toggle {
        position: fixed;
        z-index: 1;
        top: calc(env(safe-area-inset-top) + 58px);
        padding: 10px 14px;
        min-height: 44px;
        font: 600 14px/1 system-ui, -apple-system, sans-serif;
        color: #e8ecff;
        background: rgba(20, 24, 48, 0.78);
        border: 1px solid rgba(160, 180, 255, 0.45);
        border-radius: 22px;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      #reset-offset {
        right: calc(env(safe-area-inset-right) + 12px);
      }
      #layers-toggle {
        left: calc(env(safe-area-inset-left) + 12px);
      }
      #cardboard-toggle {
        top: calc(env(safe-area-inset-top) + 110px);
        right: calc(env(safe-area-inset-right) + 12px);
      }
      #reset-offset:active,
      #layers-toggle:active,
      #cardboard-toggle:active,
      #layers-toggle[aria-expanded='true'] {
        background: rgba(60, 70, 120, 0.9);
      }
      #reset-offset:focus-visible,
      #layers-toggle:focus-visible,
      #cardboard-toggle:focus-visible,
      .layer-switch input:focus-visible {
        outline: 2px solid #9fdcff;
        outline-offset: 2px;
      }
      .layers-panel {
        position: fixed;
        z-index: 2;
        top: calc(env(safe-area-inset-top) + 110px);
        left: calc(env(safe-area-inset-left) + 12px);
        width: min(300px, calc(100vw - 24px));
        max-height: calc(100vh - env(safe-area-inset-top) - 170px);
        overflow-y: auto;
        overscroll-behavior: contain;
        box-sizing: border-box;
        padding: 6px 14px 10px;
        font: 14px/1.3 system-ui, -apple-system, sans-serif;
        color: #e8ecff;
        background: rgba(12, 14, 32, 0.92);
        border: 1px solid rgba(160, 180, 255, 0.35);
        border-radius: 14px;
      }
      .layers-section > summary {
        min-height: 36px;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9fdcff;
        cursor: pointer;
        list-style: none;
        -webkit-tap-highlight-color: transparent;
      }
      .layers-section > summary::-webkit-details-marker {
        display: none;
      }
      .layers-section > summary::before {
        content: '▸';
        display: inline-block;
        width: 10px;
      }
      .layers-section[open] > summary::before {
        content: '▾';
      }
      .layers-section > summary:focus-visible {
        outline: 2px solid #9fdcff;
        outline-offset: 2px;
      }
      .layer-switch__status {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 9px;
        font-size: 10px;
        font-weight: 600;
        white-space: nowrap;
        color: #0c0e20;
        background: #9fb0d8;
      }
      .layer-switch__status[hidden] {
        display: none;
      }
      .layer-switch__status[data-tone='live'] {
        background: #5ee08a;
      }
      .layer-switch__status[data-tone='stale'] {
        background: #ffcf5c;
      }
      .layer-switch__status[data-tone='error'] {
        background: #ff8a7a;
      }
      .layers-credits ul {
        margin: 4px 0 6px;
        padding-left: 16px;
        font-size: 11px;
        line-height: 1.45;
        color: rgba(232, 236, 255, 0.8);
      }
      .layers-credits li {
        margin-bottom: 5px;
      }
      .layers-credits strong {
        color: #e8ecff;
        font-weight: 600;
      }
      .layers-credits a {
        color: #9fdcff;
      }
      .layer-switch {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-height: 44px;
        padding: 6px 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      .layer-switch input {
        flex: none;
        width: 20px;
        height: 20px;
        margin: 0;
        accent-color: #9fdcff;
      }
      .layer-switch__text {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .layer-switch__legend {
        display: block;
        width: 120px;
        height: 6px;
        border-radius: 3px;
      }
      .layer-switch__caption {
        font-size: 11px;
        color: rgba(232, 236, 255, 0.65);
      }
      /* Cardboard: nothing but the two eyes; the viewer's button taps to leave. */
      body.stereo #hud,
      body.stereo .compass-bar,
      body.stereo #reset-offset,
      body.stereo #layers-toggle,
      body.stereo #layers-panel,
      body.stereo #cardboard-toggle {
        display: none;
      }
      #hud {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 14px;
        /* Sits above the canvas but must never swallow orbit drags. */
        pointer-events: none;
        font: 13px/1.4 system-ui, -apple-system, sans-serif;
        color: #cfd4e8;
        background: linear-gradient(to top, rgba(5, 5, 16, 0.85), transparent);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Transparent Earth</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #canvas-container {
        width: 100%;
        height: 100%;
      }
      #canvas-container canvas {
        display: block;
        /* Orbit drags are ours: without this, mobile browsers claim the
           gesture for panning and cancel the pointer stream mid-drag. */
        touch-action: none;
      }
      .place-labels {
        position: fixed;
        inset: 0;
        overflow: hidden;
        /* Names sit over the canvas but must never swallow drags. */
        pointer-events: none;
        font-family: system-ui, -apple-system, sans-serif;
        text-shadow: 0 0 3px #000, 0 1px 2px #000;
        white-space: nowrap;
      }
      .place-label {
        position: absolute;
        left: 0;
        top: 0;
        will-change: transform;
      }
      .place-label--country {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #ffe2a0;
      }
      .place-label--state {
        font-size: 11px;
        color: #d4ddff;
      }
      .place-label--city {
        font-size: 11px;
        color: #ffffff;
      }
      .compass-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: calc(env(safe-area-inset-top) + 46px);
        overflow: hidden;
        /* Over the scene and the labels, but drags pass through to the view. */
        z-index: 1;
        pointer-events: none;
        font-family: system-ui, -apple-system, sans-serif;
        color: #e8ecff;
        background: linear-gradient(to bottom, rgba(5, 5, 16, 0.85), rgba(5, 5, 16, 0.55));
        border-bottom: 1px solid rgba(160, 180, 255, 0.25);
        text-shadow: 0 1px 2px #000;
      }
      .compass-bar__tape {
        position: absolute;
        left: 0;
        right: 0;
        top: env(safe-area-inset-top);
        height: 28px;
      }
      /* Each tick is a zero-width anchor at its bearing; the line and the
         centred label hang off it. */
      .compass-tick {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
        will-change: transform;
      }
      .compass-tick::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: 0;
        height: 6px;
        border-left: 1px solid rgba(220, 228, 255, 0.5);
      }
      .compass-tick--major::after,
      .compass-tick--cardinal::after {
        height: 10px;
        border-left-color: rgba(232, 236, 255, 0.85);
      }
      .compass-tick--north::after {
        border-left: 2px solid #ff7a6b;
      }
      .compass-tick span {
        position: absolute;
        left: 0;
        bottom: 13px;
        transform: translateX(-50%);
        color: rgba(232, 236, 255, 0.8);
      }
      .compass-tick--cardinal span {
        font-weight: 700;
        font-size: 13px;
        color: #fff;
      }
      .compass-tick--north span {
        color: #ff7a6b;
      }
      .compass-bar__caret {
        position: absolute;
        left: 50%;
        top: calc(env(safe-area-inset-top) + 28px);
        width: 0;
        height: 0;
        margin-left: -5px;
        border-left: 5px solid transparent;
        border-right: 5px solid transparent;
        border-bottom: 6px solid #9fdcff;
      }
      .compass-bar__readout {
        position: absolute;
        left: 50%;
        top: calc(env(safe-area-inset-top) + 33px);
        transform: translateX(-50%);
        font: 600 11px/1 system-ui, -apple-system, sans-serif;
        color: #9fdcff;
      }
      #reset-offset {
        position: fixed;
        z-index: 1;
        top: calc(env(safe-area-inset-top) + 58px);
        right: calc(env(safe-area-inset-right) + 12px);
        padding: 10px 14px;
        min-height: 44px;
        font: 600 14px/1 system-ui, -apple-system, sans-serif;
        color: #e8ecff;
        background: rgba(20, 24, 48, 0.78);
        border: 1px solid rgba(160, 180, 255, 0.45);
        border-radius: 22px;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      #reset-offset:active {
        background: rgba(60, 70, 120, 0.9);
      }
      #reset-offset:focus-visible {
        outline: 2px solid #9fdcff;
        outline-offset: 2px;
      }
      #hud {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 14px;
        /* Sits above the canvas but must never swallow orbit drags. */
        pointer-events: none;
        font: 13px/1.4 system-ui, -apple-system, sans-serif;
        color: #cfd4e8;
        background: linear-gradient(to top, rgba(5, 5, 16, 0.85), transparent);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

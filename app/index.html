<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Transparent Earth</title>
    <!-- No icon file: an empty one stops the browser asking for /favicon.ico and logging a 404. -->
    <link rel="icon" href="data:," />
    <style>
      :root {
        /* The compass bar's height: the gaze pointer's clear area starts beneath it. */
        --compass-bar-height: calc(env(safe-area-inset-top) + 46px);
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #canvas-container {
        width: 100%;
        height: 100%;
      }
      #canvas-container canvas {
        display: block;
        /* Orbit drags are ours: without this, mobile browsers claim the
           gesture for panning and cancel the pointer stream mid-drag. */
        touch-action: none;
      }
      .place-labels {
        position: fixed;
        inset: 0;
        overflow: hidden;
        /* Names sit over the canvas but must never swallow drags. */
        pointer-events: none;
        font-family: system-ui, -apple-system, sans-serif;
        text-shadow: 0 0 3px #000, 0 1px 2px #000;
        white-space: nowrap;
      }
      /* Cardboard: each eye's labels clipped to its half of the screen. */
      .place-labels--left-eye {
        right: 50%;
      }
      .place-labels--right-eye {
        left: 50%;
      }
      .place-label {
        position: absolute;
        left: 0;
        top: 0;
        will-change: transform;
      }
      .place-label--country {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #ffe2a0;
      }
      .place-label--state {
        font-size: 11px;
        color: #d4ddff;
      }
      .place-label--city {
        font-size: 11px;
        color: #ffffff;
      }
      /* Geology, coloured to match its lines where it has them. */
      .place-label--plate {
        font-size: 12px;
        font-style: italic;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #d9c2ff;
      }
      .place-label--deep {
        font-size: 11px;
        font-weight: 600;
        color: #ffb38a;
      }
      .place-label--hotspot {
        font-size: 11px;
        color: #ffd166;
      }
      .place-label--subduction {
        font-size: 10px;
        font-style: italic;
        color: #ff8a8a;
      }
      .place-label--quake {
        font-size: 10px;
        font-weight: 600;
        color: #ffffff;
      }
      .place-label--volcano {
        font-size: 10px;
        color: #ff7b54;
      }
      /* A guide's mark: a ring on the point, its text hung beneath. The box is centred on the point, so the text is pushed down and the ring drawn back up. */
      .place-label--ring {
        margin-top: 1.9em;
      }
      .place-label--ring::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        box-sizing: border-box;
        width: 2em;
        height: 2em;
        margin: -2.9em 0 0 -1em;
        border: 2px solid currentColor;
        border-radius: 50%;
        box-shadow: 0 0 3px #000, inset 0 0 3px #000;
      }
      .compass-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: var(--compass-bar-height);
        overflow: hidden;
        /* Over the scene and the labels, but drags pass through to the view. */
        z-index: 1;
        pointer-events: none;
        font-family: system-ui, -apple-system, sans-serif;
        color: #e8ecff;
        background: linear-gradient(to bottom, rgba(5, 5, 16, 0.85), rgba(5, 5, 16, 0.55));
        border-bottom: 1px solid rgba(160, 180, 255, 0.25);
        text-shadow: 0 1px 2px #000;
      }
      .compass-bar__tape {
        position: absolute;
        left: 0;
        right: 0;
        top: env(safe-area-inset-top);
        height: 28px;
      }
      /* Each tick is a zero-width anchor at its bearing; the line and the
         centred label hang off it. */
      .compass-tick {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
        will-change: transform;
      }
      .compass-tick::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: 0;
        height: 6px;
        border-left: 1px solid rgba(220, 228, 255, 0.5);
      }
      .compass-tick--major::after,
      .compass-tick--cardinal::after {
        height: 10px;
        border-left-color: rgba(232, 236, 255, 0.85);
      }
      .compass-tick--north::after {
        border-left: 2px solid #ff7a6b;
      }
      .compass-tick span {
        position: absolute;
        left: 0;
        bottom: 13px;
        transform: translateX(-50%);
        color: rgba(232, 236, 255, 0.8);
      }
      .compass-tick--cardinal span {
        font-weight: 700;
        font-size: 13px;
        color: #fff;
      }
      .compass-tick--north span {
        color: #ff7a6b;
      }
      /* The slice of the compressed tape the camera actually sees. */
      .compass-bar__fov {
        position: absolute;
        left: 0;
        top: env(safe-area-inset-top);
        height: 28px;
        box-sizing: border-box;
        background: rgba(159, 220, 255, 0.12);
        border-left: 1px solid rgba(159, 220, 255, 0.55);
        border-right: 1px solid rgba(159, 220, 255, 0.55);
      }
      .compass-bar__caret {
        position: absolute;
        left: 50%;
        top: calc(env(safe-area-inset-top) + 28px);
        width: 0;
        height: 0;
        margin-left: -5px;
        border-left: 5px solid transparent;
        border-right: 5px solid transparent;
        border-bottom: 6px solid #9fdcff;
      }
      .compass-bar__readout {
        position: absolute;
        left: 50%;
        top: calc(env(safe-area-inset-top) + 33px);
        transform: translateX(-50%);
        font: 600 11px/1 system-ui, -apple-system, sans-serif;
        color: #9fdcff;
      }
      /* The way to a target the user has to turn to. Its box is the clear
         area: the view beneath the compass bar and inside the safe area.
         A target outside the box counts as out of sight, so it gets the
         arrow rather than a ring under the bar. Over the buttons, so the
         arrow is never under one; drags pass through. */
      .gaze-pointer {
        position: fixed;
        top: var(--compass-bar-height);
        right: env(safe-area-inset-right);
        bottom: env(safe-area-inset-bottom);
        left: env(safe-area-inset-left);
        z-index: 2;
        pointer-events: none;
        font: 600 14px/1.2 system-ui, -apple-system, sans-serif;
        color: #ffd27a;
        text-shadow: 0 0 3px #000, 0 1px 2px #000;
        white-space: nowrap;
      }
      .gaze-pointer__arrow,
      .gaze-pointer__ring,
      .gaze-pointer__name {
        position: absolute;
        left: 0;
        top: 0;
      }
      /* The glyph is at the edge and the text inward of it, whichever edge that is. */
      .gaze-pointer__arrow {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .gaze-pointer__arrow[data-edge='left'] {
        flex-direction: row-reverse;
      }
      .gaze-pointer__arrow[data-edge='top'] {
        flex-direction: column-reverse;
      }
      .gaze-pointer__arrow[data-edge='bottom'] {
        flex-direction: column;
      }
      .gaze-pointer__glyph {
        font-size: 20px;
        line-height: 1;
      }
      /* Read out, not seen: the pointer going up and the arrival, once each. */
      .gaze-pointer__status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      .gaze-pointer__ring {
        width: 48px;
        height: 48px;
        margin: -24px 0 0 -24px;
        border: 2px solid currentColor;
        border-radius: 50%;
        box-shadow: 0 0 3px #000, inset 0 0 3px #000;
      }
      #reset-offset,
      #layers-toggle,
      #cardboard-toggle,
      #cardboard-calibrate,
      #voice-talk,
      #ar-toggle {
        position: fixed;
        z-index: 1;
        top: calc(env(safe-area-inset-top) + 58px);
        padding: 10px 14px;
        min-height: 44px;
        font: 600 14px/1 system-ui, -apple-system, sans-serif;
        color: #e8ecff;
        background: rgba(20, 24, 48, 0.78);
        border: 1px solid rgba(160, 180, 255, 0.45);
        border-radius: 22px;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      #reset-offset {
        right: calc(env(safe-area-inset-right) + 12px);
      }
      #layers-toggle {
        left: calc(env(safe-area-inset-left) + 12px);
      }
      #cardboard-toggle {
        top: calc(env(safe-area-inset-top) + 110px);
        right: calc(env(safe-area-inset-right) + 12px);
      }
      #ar-toggle {
        top: calc(env(safe-area-inset-top) + 162px);
        right: calc(env(safe-area-inset-right) + 12px);
      }
      #cardboard-calibrate {
        top: calc(env(safe-area-inset-top) + 214px);
        right: calc(env(safe-area-inset-right) + 12px);
      }
      #voice-talk {
        top: calc(env(safe-area-inset-top) + 266px);
        right: calc(env(safe-area-inset-right) + 12px);
        /* Held down, not tapped: no text selection or callout under the thumb. */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }
      #reset-offset:active,
      #layers-toggle:active,
      #cardboard-toggle:active,
      #cardboard-calibrate:active,
      #voice-talk.voice-talk--held,
      #ar-toggle:active,
      #layers-toggle[aria-expanded='true'] {
        background: rgba(60, 70, 120, 0.9);
      }
      #reset-offset:focus-visible,
      #layers-toggle:focus-visible,
      #cardboard-toggle:focus-visible,
      #cardboard-calibrate:focus-visible,
      #voice-talk:focus-visible,
      #ar-toggle:focus-visible,
      .layer-switch input:focus-visible {
        outline: 2px solid #9fdcff;
        outline-offset: 2px;
      }
      .layers-panel {
        position: fixed;
        z-index: 2;
        top: calc(env(safe-area-inset-top) + 110px);
        left: calc(env(safe-area-inset-left) + 12px);
        width: min(360px, calc(100vw - 24px));
        max-height: calc(100vh - env(safe-area-inset-top) - 170px);
        overflow-y: auto;
        overscroll-behavior: contain;
        box-sizing: border-box;
        padding: 0 14px 10px;
        font: 14px/1.3 system-ui, -apple-system, sans-serif;
        color: #e8ecff;
        background: rgba(12, 14, 32, 0.92);
        border: 1px solid rgba(160, 180, 255, 0.35);
        border-radius: 14px;
      }
      /* A phone on its side has little height: the panel runs to the foot of the screen, over the status line. */
      @media (max-height: 520px) {
        .layers-panel {
          max-height: calc(100vh - env(safe-area-inset-top) - 118px);
        }
      }
      /* On a phone the open panel is nearly as wide as the screen: the button it would half cover steps aside. */
      @media (max-width: 520px) {
        body.layers-open #cardboard-toggle,
        body.layers-open #cardboard-calibrate,
        body.layers-open #ar-toggle {
          visibility: hidden;
        }
      }
      /* Presets: one tap sets every switch; the one the switches stand at is lit. */
      .layers-presets {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 8px 0 6px;
      }
      .layers-preset {
        min-height: 36px;
        padding: 6px 12px;
        font: 600 13px/1.2 system-ui, -apple-system, sans-serif;
        color: #e8ecff;
        background: rgb(28, 32, 60);
        border: 1px solid rgba(160, 180, 255, 0.35);
        border-radius: 18px;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .layers-preset[aria-pressed='true'] {
        color: #0c0e20;
        background: #9fdcff;
        border-color: #9fdcff;
      }
      .layers-preset:focus-visible {
        outline: 2px solid #9fdcff;
        outline-offset: 2px;
      }
      .layers-filter {
        position: sticky;
        top: 0;
        z-index: 1;
        display: block;
        width: 100%;
        box-sizing: border-box;
        min-height: 44px;
        margin: 4px 0 2px;
        padding: 0 12px;
        /* 16px: anything smaller makes iOS zoom the page on focus. */
        font: 16px/1.3 system-ui, -apple-system, sans-serif;
        color: #e8ecff;
        background: rgb(28, 32, 60);
        border: 1px solid rgba(160, 180, 255, 0.35);
        border-radius: 10px;
      }
      .layers-filter::placeholder {
        color: rgba(232, 236, 255, 0.55);
      }
      .layers-no-matches {
        margin: 10px 2px;
        font-size: 13px;
        color: rgba(232, 236, 255, 0.7);
      }
      .layers-no-matches[hidden],
      .layers-section[hidden],
      .layer-switch[hidden],
      .layers-section__all-off[hidden] {
        display: none;
      }
      .layers-section > summary {
        min-height: 44px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9fdcff;
        cursor: pointer;
        list-style: none;
        -webkit-tap-highlight-color: transparent;
      }
      .layers-section > summary::-webkit-details-marker {
        display: none;
      }
      .layers-section > summary::before {
        content: '▸';
        display: inline-block;
        width: 10px;
      }
      .layers-section[open] > summary::before {
        content: '▾';
      }
      .layers-section > summary:focus-visible,
      .layers-filter:focus-visible,
      .layers-section__all-off:focus-visible {
        outline: 2px solid #9fdcff;
        outline-offset: 2px;
      }
      .layers-section__count {
        margin-left: auto;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: none;
        color: rgba(232, 236, 255, 0.5);
      }
      .layers-section__count--on {
        color: #5ee08a;
      }
      .layers-section__all-off {
        display: block;
        margin: 0 0 2px auto;
        min-height: 44px;
        padding: 0 12px;
        font: 600 12px/1 system-ui, -apple-system, sans-serif;
        color: #9fdcff;
        background: none;
        border: 1px solid rgba(160, 180, 255, 0.3);
        border-radius: 10px;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      /* A chip says how a layer that is showing is doing; for one that is off, only a failure is news. */
      .layer-switch input:not(:checked) + .layer-switch__text .layer-switch__status:not([data-tone='error']) {
        display: none;
      }
      .layer-switch__status {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 9px;
        font-size: 10px;
        font-weight: 600;
        white-space: nowrap;
        color: #0c0e20;
        background: #9fb0d8;
      }
      .layer-switch__status[hidden] {
        display: none;
      }
      .layer-switch__status[data-tone='live'] {
        background: #5ee08a;
      }
      .layer-switch__status[data-tone='stale'] {
        background: #ffcf5c;
      }
      .layer-switch__status[data-tone='error'] {
        background: #ff8a7a;
      }
      .layers-credits ul {
        margin: 4px 0 6px;
        padding-left: 16px;
        font-size: 11px;
        line-height: 1.45;
        color: rgba(232, 236, 255, 0.8);
      }
      .layers-credits li {
        margin-bottom: 5px;
      }
      .layers-credits strong {
        color: #e8ecff;
        font-weight: 600;
      }
      .layers-credits a {
        color: #9fdcff;
      }
      .layer-switch {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-height: 44px;
        padding: 6px 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      .layer-switch input {
        flex: none;
        width: 20px;
        height: 20px;
        margin: 0;
        accent-color: #9fdcff;
      }
      .layer-switch__text {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .layer-switch__legend {
        display: block;
        width: 120px;
        height: 6px;
        border-radius: 3px;
      }
      .layer-switch__caption {
        font-size: 11px;
        color: rgba(232, 236, 255, 0.65);
        /* Two lines until the layer is on: then it is worth reading in full. */
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
      }
      .layer-switch input:checked + .layer-switch__text .layer-switch__caption {
        display: block;
      }
      /* Cardboard: nothing but the two eyes; the viewer's button taps to leave. */
      body.stereo #hud,
      body.stereo .compass-bar,
      body.stereo #reset-offset,
      body.stereo #layers-toggle,
      body.stereo #layers-panel,
      body.stereo #cardboard-toggle,
      body.stereo #cardboard-calibrate,
      body.stereo #voice-talk,
      body.stereo #ar-toggle {
        display: none;
      }
      /* Calibrating: one readout per eye, under its convergence spot, so merged they read as one. */
      #cardboard-calibration {
        display: none;
        position: fixed;
        inset: 0;
        pointer-events: none;
        font: 600 12px/1.2 system-ui, -apple-system, sans-serif;
        color: #e8ecff;
      }
      body.cardboard-calibrating #cardboard-calibration {
        display: block;
      }
      .cardboard-calibration__readout {
        position: absolute;
        transform: translate(-50%, 36px);
        white-space: nowrap;
        padding: 4px 8px;
        background: rgba(12, 14, 32, 0.7);
        border-radius: 8px;
      }
      /* The spot itself: a small cross to lay the star on. */
      .cardboard-calibration__readout::before {
        content: '+';
        position: absolute;
        left: 50%;
        top: -36px;
        transform: translate(-50%, -50%);
        font-size: 20px;
        color: #9fdcff;
      }
      /* Voice: what was heard and the reply; in Cardboard one copy per eye (VoiceOverlay.place). */
      #voice-status {
        position: fixed;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        font: 600 14px/1.3 system-ui, -apple-system, sans-serif;
        color: #e8ecff;
      }
      #voice-status[hidden],
      .voice-status__readout[hidden] {
        display: none;
      }
      .voice-status__readout {
        position: absolute;
        transform: translateX(-50%);
        width: max-content;
        padding: 8px 12px;
        text-align: center;
        background: rgba(12, 14, 32, 0.8);
        border: 1px solid rgba(160, 180, 255, 0.35);
        border-radius: 14px;
      }
      #voice-status[data-state='error'] .voice-status__readout {
        border-color: rgba(255, 150, 130, 0.7);
      }
      body.stereo .voice-status__readout {
        font-size: 12px;
      }
      /* AR: the camera fills the screen and the WebXR overlay is all that shows over it. */
      #ar-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font: 600 15px/1.3 system-ui, -apple-system, sans-serif;
        color: #e8ecff;
      }
      #ar-overlay[hidden] {
        display: none;
      }
      #ar-overlay .ar-status {
        position: absolute;
        left: 50%;
        bottom: calc(env(safe-area-inset-bottom) + 24px);
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100vw - 32px);
        margin: 0;
        padding: 10px 14px;
        text-align: center;
        background: rgba(12, 14, 32, 0.72);
        border-radius: 14px;
      }
      #ar-overlay .ar-exit {
        position: absolute;
        top: calc(env(safe-area-inset-top) + 16px);
        right: calc(env(safe-area-inset-right) + 16px);
        min-height: 44px;
        padding: 10px 16px;
        font: inherit;
        color: inherit;
        background: rgba(20, 24, 48, 0.85);
        border: 1px solid rgba(160, 180, 255, 0.45);
        border-radius: 22px;
        pointer-events: auto;
        touch-action: manipulation;
      }
      #hud {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 14px;
        /* Sits above the canvas but must never swallow orbit drags. */
        pointer-events: none;
        font: 13px/1.4 system-ui, -apple-system, sans-serif;
        color: #cfd4e8;
        background: linear-gradient(to top, rgba(5, 5, 16, 0.85), transparent);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Transparent Earth</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #canvas-container {
        width: 100%;
        height: 100%;
      }
      #canvas-container canvas {
        display: block;
        /* Orbit drags are ours: without this, mobile browsers claim the
           gesture for panning and cancel the pointer stream mid-drag. */
        touch-action: none;
      }
      .place-labels {
        position: fixed;
        inset: 0;
        overflow: hidden;
        /* Names sit over the canvas but must never swallow drags. */
        pointer-events: none;
        font-family: system-ui, -apple-system, sans-serif;
        text-shadow: 0 0 3px #000, 0 1px 2px #000;
        white-space: nowrap;
      }
      .place-label {
        position: absolute;
        left: 0;
        top: 0;
        will-change: transform;
      }
      .place-label--country {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #ffe2a0;
      }
      .place-label--state {
        font-size: 11px;
        color: #d4ddff;
      }
      .place-label--city {
        font-size: 11px;
        color: #ffffff;
      }
      #reset-offset {
        position: fixed;
        top: calc(env(safe-area-inset-top) + 12px);
        right: calc(env(safe-area-inset-right) + 12px);
        padding: 10px 14px;
        min-height: 44px;
        font: 600 14px/1 system-ui, -apple-system, sans-serif;
        color: #e8ecff;
        background: rgba(20, 24, 48, 0.78);
        border: 1px solid rgba(160, 180, 255, 0.45);
        border-radius: 22px;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      #reset-offset:active {
        background: rgba(60, 70, 120, 0.9);
      }
      #reset-offset:focus-visible {
        outline: 2px solid #9fdcff;
        outline-offset: 2px;
      }
      #hud {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 14px;
        /* Sits above the canvas but must never swallow orbit drags. */
        pointer-events: none;
        font: 13px/1.4 system-ui, -apple-system, sans-serif;
        color: #cfd4e8;
        background: linear-gradient(to top, rgba(5, 5, 16, 0.85), transparent);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
